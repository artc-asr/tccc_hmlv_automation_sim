# Galbot G1 (One Golf) in the transfer cell: what transfer_demo.py and
# transfer_scene.py need to know about the robot. Model: robots/g1/ (Fortress).
name: g1
label: Galbot G1
moveit_config: {robot: galbot_g1, package: galbot_g1_moveit_config}

scene:
  base_front: 0.307        # chassis front face, x in base_link (collision bounds, ±0.307 m square)
  base_z: 0.032            # base_link height resting on the ground (measured, Fortress)
  # Pallet A one layer higher than the Moz1's (4: top-layer handles 1.09 m up in
  # base_link), picked from row 4 (0.79 m out): the highest and furthest the G1
  # picks WITHOUT TIPPING (scripts/reach_sweep.py, 90 leg poses, 2026-09-30).
  # 4 layers: rows 1-5 in reach, 6-8 not; row 5 only with the upper body fully
  # forward, which puts the centre of mass past the front wheels (x 0.18-0.25 m
  # vs 0.176): leaning there the G1 tipped 4.4° onto them and slid 6 cm back.
  # Row 4: 6 stable poses. 5 layers (handles 1.33 m): not even row 3 in reach.
  layers: 4
  cleared_rows: 3
  box_on_floor: true       # no pallet B: the box for the filled pair stands on the floor

tcp_link: "{side}_gripper_tcp_link"
touch_links: [gripper_flange_link, gripper_base_link, gripper_tcp_link,
              gripper_l_knuckle_link, gripper_l_inner_knuckle_link, gripper_l_finger_link,
              gripper_r_knuckle_link, gripper_r_inner_knuckle_link, gripper_r_finger_link]

arm_joints:
  left: [left_arm_joint1, left_arm_joint2, left_arm_joint3, left_arm_joint4, left_arm_joint5, left_arm_joint6, left_arm_joint7]
  right: [right_arm_joint1, right_arm_joint2, right_arm_joint3, right_arm_joint4, right_arm_joint5, right_arm_joint6, right_arm_joint7]
arm_limits:                # URDF ranges
  left: [[-3.004, 3.004], [-1.608, 1.608], [-2.917, 2.917], [-2.568, 1.870], [-2.917, 2.917], [-0.823, 0.735], [-1.538, 1.538]]
  right: [[-3.004, 3.004], [-1.608, 1.608], [-2.917, 2.917], [-1.870, 2.568], [-2.917, 2.917], [-0.735, 0.823], [-1.538, 1.538]]
home_arms:                 # the SRDF "home": hands in front of the chest
  left: [1.45, -0.85, 0.0, -2.07, -1.58, -0.72, 0.0]
  right: [-1.45, 0.85, 0.0, 2.07, 1.58, 0.72, 0.0]

torso_joints: [leg_joint1, leg_joint2, leg_joint3, leg_joint4, leg_joint5]
torso_controller: leg_controller
# Leg poses (degrees). home = the standing stance (0.6, 1.8, 1.2, 0, 0) rad. The torso
# stays upright while leg_joint3 = leg_joint2 - leg_joint1; more leg_joint3 than that
# leans it forward (~0.1 m of shoulder per 0.3 rad), more leg_joint1 moves the whole
# upper body forward, less leg_joint2 lowers it. From an offline IK sweep over the leg
# (collision-aware, both arms, pre-grasp and grasp; scene with cleared_rows 4, 3 layers):
#   pallet A row 5 (handles 0.92 m out): not from home; reach, lean, reach_lean, …
#   conveyor: home and most poses;  pallet-B box: crouch, reach and many low poses.
# Re-swept for 4 layers and the box on the floor with reach_sweep.py, which also
# checks tipping: the whole robot's centre of mass (95 kg, only 23 kg of it in
# the chassis; 17 kg in leg_link1, which leg_joint1 swings forward) must stay
# behind x = 0.15 m in base_link — the front wheels touch down at 0.176 m.
# Centre of mass x at the grasp:
#   pallet A row 4, empty pair: lean 0.138, (0.6, 1.5, 1.2) 0.147; reach 0.180,
#     reach_lean 0.231 TIP.  Row 5: every pose that reaches it tips (0.18-0.25).
#   box on the floor, filled pair (8.4 kg): crouch 0.144, floor_lean 0.125,
#     floor_back 0.070; (0.6, 1.2, 1.2) 0.188 and (0.6, 0.9, 0.9) 0.214 TIP.
# The leg actuators are rated 280-420 N·m (Galbot's MuJoCo model), so unlike the
# Moz1's torso the loaded pair needs no special carry posture.
torso_presets:
  home: [34.4, 103.1, 68.8, 0, 0]
  carry: [34.4, 103.1, 68.8, 0, 0]
  reach: [51.6, 103.1, 51.6, 0, 0]        # (0.9, 1.8, 0.9): upright, 0.22 m forward
  lean: [34.4, 103.1, 103.1, 0, 0]        # (0.6, 1.8, 1.8): leaning forward
  reach_lean: [51.6, 103.1, 85.9, 0, 0]   # (0.9, 1.8, 1.5)
  crouch: [34.4, 68.8, 34.4, 0, 0]        # (0.6, 1.2, 0.6): upright, shoulders ~0.25 m lower
  floor_lean: [17.2, 68.8, 85.9, 0, 0]    # (0.3, 1.2, 1.5): crouched, hips back, leaning
  floor_back: [2.9, 68.8, 100.3, 0, 0]    # (0.05, 1.2, 1.75): hips right back, leaning more
  stretch: [51.6, 131.8, 97.4, 0, 0]      # (0.9, 2.3, 1.7): legs up and forward, leaning
# only poses that don't tip the robot (reach, reach_lean do, from row 4 on). With
# ik_filter (below) the sweep finds row 4 cleanly only from lean (8 cm approach,
# see pick_approach) and stretch (centre of mass 0.148 m: least tipping margin).
# (not home: it never reaches row 4 — its failed reach check only costs ~10 s)
pick_torsos: [lean, stretch]
# The box on the floor. Not crouch any more: it reaches the box only with an arm
# joint on its limit (ik_filter); floor_lean 0.117 m, floor_back 0.070 m.
deck_torsos: [floor_lean, floor_back]
# Hands this high above pallet A's handles before the descent (default 0.12, the
# pre-grasp height). With lean, 12 cm above the top layer (1.21 m) is the edge of
# the arm's reach: every KDL solution had joint2 or joint7 within 1.2° of its
# limit; 8 cm (still 5 cm of finger clearance over the handles) has clean ones.
pick_approach: 0.08
# Hands this high above the handles before going down into the box on pallet B
# (default 0.12, the pre-grasp height, which clears the 10 cm walls by ~2 cm). With
# 0.12 the G1's move over the box clipped the box wall with a held can and, planned
# around it, once ended 11 cm off the slot.
box_approach: 0.17
# The lean over pallet A with the arms straight to the pre-grasp: if that direct
# move collides (an IK solution on another arm branch), try this many fresh IK
# solutions, least joint travel first, before leaning with the arms at home —
# which runs the hands into the 4-layer stack.
lean_retries: 6
# ... and if all of those collide (the 4-layer stack's row 4: every solution
# was a ~200° swing through a neighbouring can), plan torso and arms together
# around the stack with this SRDF group (galbot_g1_moveit_config).
lean_group: torso_dual_arm
# Over the box the hands keep the grasp yaw they hold the filled cans with: the
# handle is at one end of the can, and the other yaw (a wrist half-turn, 230° of
# joint travel) swung one can into the other.
keep_grasp_yaw: true
# Curling the loaded arms in: straight lines only (20, 15, 10, 5 cm), else carry as
# they are — a free-space tuck with the filled pair swung the left wrist 150° with
# joint6 / joint7 pressed on their limits for 10 s.
tuck_straight_only: true
# IK quality (transfer_demo.ik_ok). KDL, the G1's solver, clamps to the joint
# limits and returns whatever branch it lands on: in the recorded run (2026-09-30)
# arm joints sat exactly ON their limits in most phases, and the loaded right wrist
# passed joint6 = 0 (its singularity: joints 5 and 7 aligned) — the tuck after the
# filled pick wanted a 252° wrist swing, the fallback parked right joint5 on its
# 167° limit, and the wrist then oscillated 25-33° p-p at ~1.5 Hz through the
# whole loaded drive. So: IK solutions only with every arm joint >= limit_margin
# (deg) inside its limits and |wrist_joint| >= wrist_min (deg), retried `tries`
# times from seeds around the current arm; straight-line paths only within the
# limit margin (else the move goes joint-space to such a solution).
# path_margin (deg): straight-line paths only have to stay that far off the stops.
# tries: about 13% of KDL's answers at lean's pallet-A pre-grasp pass the filter, so
# at 10 tries per grasp yaw the reach check missed lean ~1 run in 8 (and took
# stretch, whose pull out of the row then ran a joint into its limit); 25 makes
# that ~1 in 1000.
ik_filter: {limit_margin: 4.0, path_margin: 1.0, wrist_joint: 6, wrist_min: 8.0, tries: 25}

# <side>_gripper_joint: 0 open (124 mm between the finger pads) .. 1.703 closed.
# From the URDF: 0.6 ≈ 94 mm, 0.9 ≈ 70 mm, 1.2 ≈ 44 mm, 1.42 ≈ 25 mm (the 24 mm
# bar); grasp_helper welds past 1.1 (≈ 52 mm, before the pads touch).
# Closed to 1.30 (~35 mm), not onto the bar: KinematicGrasp holds the can on its
# own, one physics step behind the hand, so fingers squeezing the bar (1.42) are in
# contact with a can that lags into them whenever the body carries the hands:
# during the loaded torso move to the box the fingers were shoved 1.24-1.52 and
# both wrist rolls (joint7) twisted 30° with ±15° jitter, uncommanded.
gripper: {open: 0.6, approach: 0.9, closed: 1.30,
          closed_threshold: 1.1, open_threshold: 0.9,
          detach_on_open: false}
# detach_on_open false: grasp_helper releases a can only when told to (the demo
# does, in place_pair). Loaded and swinging fast (the 237° move over the box on
# pallet B) the G1's fingers get pushed open past 0.9: the open edge detached the
# can 4 times mid-move, it dropped each time and was re-welded 18 cm lower.
# Top-down grasp, jaw closing along base x across the handle bar. The G1's tcp
# approaches along its +X and the fingers close along ±Y, so x_tcp = -z,
# y_tcp = +x, z_tcp = -y; the second entry is the same grasp yawed 180°. [x, y, z, w]
grasp_quats: [[0.5, 0.5, -0.5, 0.5], [-0.5, 0.5, 0.5, 0.5]]
# The finger pads reach 48 mm below the tcp and the bar's centre is 34 mm above
# the can body: grasp 2 cm higher so the fingertips stay clear of the body.
grasp_z_offset: 0.02
