# joint_name_map.yaml  --  sim joint name  ->  canonical URDF name.
#
# Populate this from the "REMAP SKELETON" that discover_prims.py prints inside
# Isaac Sim (Phase 1). Left side = exact sim joint name; right side = the
# canonical name the real moz1_description / moz1_moveit_config uses.
#
# Rules:
#   * Any sim joint NOT listed here passes through unchanged.
#   * Blank values are ignored (treated as "not yet mapped" -> pass-through).
#   * Keep this in sync if the sim USD joints change.
#
# The entries below are a STARTING GUESS based on the known wheel naming
# (sim 'Base_0' underscore vs real 'Base-0' hyphen). VERIFY/COMPLETE the arm,
# torso, and gripper rows against discover_prims.py output before trusting
# MoveIt execution.

sim_to_canonical:
  # --- mecanum wheels (confirmed underscore->hyphen) ---
  "Base_0": "Base-0"
  "Base_1": "Base-1"
  "Base_2": "Base-2"
  "Base_3": "Base-3"

