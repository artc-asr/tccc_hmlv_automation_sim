# moveit_controllers.yaml - how move_group hands trajectories to controllers.
# Uses the simple controller manager talking FollowJointTrajectory to the
# controllers defined in ros2_controllers.yaml (mock hardware in demo.launch.py).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - torso_controller
    - left_gripper_controller
    - right_gripper_controller

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - LeftArm-0
      - LeftArm-1
      - LeftArm-2
      - LeftArm-3
      - LeftArm-4
      - LeftArm-5
      - LeftArm-6

  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - RightArm-0
      - RightArm-1
      - RightArm-2
      - RightArm-3
      - RightArm-4
      - RightArm-5
      - RightArm-6

  # ⚠ TORSO — Cartesian waist control, 2026-08-08 (§12.22). Joint names must match
  # moz1_bringup/config/moz1_controllers.yaml exactly or MoveIt silently cannot
  # execute against it.
  torso_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - LegWaist-0
      - LegWaist-1
      - LegWaist-2
      - LegWaist-3
      - LegWaist-4
      - LegWaist-5

  left_gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [left_gripper_joint]

  right_gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [right_gripper_joint]
