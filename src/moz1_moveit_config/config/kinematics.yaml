# IK solvers per planning group. KDL is dependency-free and ships with MoveIt
# (PRD §9.2). Swap to trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin later
# for the 7-DOF arms if KDL convergence is poor (install ros-humble-trac-ik-*).
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

# ⚠ TORSO — Cartesian control of the WAIST, added 2026-08-08 (§12.22).
#
# The group is a legal 6-DOF chain (base_link -> waist03, LegWaist-0..5, all
# revolute), so KDL solves it exactly like an arm. It had no solver purely because
# this file never listed it — which is also why RViz drew no drag marker for it.
#
# ⚠⚠ This is NOT a wrist. LegWaist-0..2 are leg01..leg03 — the lift/bend joints
# that carry the entire upper body — so a torso Cartesian goal moves the robot's
# centre of gravity. There is NO CoG or balance model anywhere in this stack, the
# torso limits in joint_limits_real.yaml are placeholders, and collision detection
# on this robot does not trigger (D1). LegWaist-2's range is asymmetric
# (-2.53..+0.017 rad): it is a bend, not a rotation. Drag it in small steps with a
# hand on the e-stop; do not treat a green plan as a safe plan.
#
# The solver only supplies IK/FK/Jacobian. Output is still a JOINT trajectory, which
# is what the SDK's send_pos_tracking_cmd wants — no new SDK capability is involved.
torso:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  # Looser than the arms' 0.05 s: 6-DOF with a restricted, asymmetric range
  # converges less readily than a redundant 7-DOF arm.
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 3

# dual_arm is a composite group; KDL can't solve a multi-tip chain. Leave it
# without a solver and plan dual_arm in joint space (or via per-arm IK).
