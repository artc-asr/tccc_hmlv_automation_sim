controller_manager:
  ros__parameters:
    update_rate: 500  # Hz, matches PHYSICS_HZ of rby1-sim-isaac
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel"]
    right_wheel_names: ["right_wheel"]
    wheel_separation: 0.53   # from <mobile params="0.53 0.1"> in the SDK URDF
    wheel_radius: 0.1
    # RB-Y1 wheel joints spin about -Y, so positive joint velocity drives backwards.
    # Negative radius multipliers flip command + odometry consistently.
    left_wheel_radius_multiplier: -1.0
    right_wheel_radius_multiplier: -1.0
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    publish_rate: 50.0
    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.5
    linear.x.min_velocity: -1.5
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0

torso_controller:
  ros__parameters:
    joints: [torso_0, torso_1, torso_2, torso_3, torso_4, torso_5]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

right_arm_controller:
  ros__parameters:
    joints: [right_arm_0, right_arm_1, right_arm_2, right_arm_3, right_arm_4, right_arm_5, right_arm_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

left_arm_controller:
  ros__parameters:
    joints: [left_arm_0, left_arm_1, left_arm_2, left_arm_3, left_arm_4, left_arm_5, left_arm_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

head_controller:
  ros__parameters:
    joints: [head_0, head_1]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

# Finger ranges: r1/l1 in [-0.05, 0], r2/l2 in [0, 0.05]; 0 = closed.
right_gripper_controller:
  ros__parameters:
    joints: [gripper_finger_r1, gripper_finger_r2]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

left_gripper_controller:
  ros__parameters:
    joints: [gripper_finger_l1, gripper_finger_l2]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
